name: Publish NuGet Package (Multi-Framework)

on:
  # 1. 手动触发：允许在 Actions 页面点击运行，并可自定义版本号
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet包版本号 (例如: 1.2.3)'
        required: true
        default: '1.0.0-manual'

  # 2. Release 触发：当你在 GitHub 上创建正式 Release 时自动运行
  release:
    types: [published]

# 全局环境变量
env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true
  # 使用绝对路径避免潜在的工作目录问题
  PACKAGE_OUTPUT_DIR: ${{ github.workspace }}/artifacts 

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read      # 拉取代码
      packages: write     # 推送包到 GitHub Packages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'  # 高版本 SDK 向下兼容，可编译多框架 (如 net6.0, net8.0, netstandard2.0)

      # 生成版本号（优先使用手动输入的版本，否则使用 Release Tag）
      - name: Set Version Number
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            # 自动去除 Tag 中可能带有的 'v' 前缀 (例如 v1.2.3 -> 1.2.3)，因为 NuGet 不支持字母前缀
            VERSION="${TAG_NAME#v}" 
          else
            VERSION="1.0.0-unknown"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Generated version: $VERSION"

      # 还原依赖（支持多框架）
      - name: Restore dependencies
        run: dotnet restore

      # 构建所有目标框架
      - name: Build project
        run: dotnet build --configuration Release --no-restore

      # 打包：生成包含所有目标框架 DLL 的 .nupkg 和 .snupkg
      - name: Pack NuGet package
        run: |
          dotnet pack --configuration Release \
            --no-build \
            --output ${{ env.PACKAGE_OUTPUT_DIR }} \
            -p:PackageVersion=${{ env.VERSION }} \
            -p:IncludeSymbols=true \
            -p:SymbolPackageFormat=snupkg

      # 推送 .nupkg 和 .snupkg 到 GitHub Packages
      - name: Push NuGet package
        run: |
          # 直接使用 --api-key 推送，无需提前 add source，代码更简洁安全
          dotnet nuget push "${{ env.PACKAGE_OUTPUT_DIR }}/*.nupkg" \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate