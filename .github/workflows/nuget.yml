name: Publish NuGet to GitHub Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Package Version (e.g., 1.0.0)'
        required: true
        default: '2.0.0'

env:
  # GitHub Packages NuGet 源，repository_owner 会自动解析为你的组织名或用户名
  NUGET_SOURCE: "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 推送到 GitHub Packages 必须声明此权限

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # 根据你的最高目标框架调整，高版本 SDK 可以向下兼容编译低版本和 netstandard
          dotnet-version: '10..0.x' 
          # 配置源，以便 restore 时能拉取同组织下的其他依赖包
          source-url: ${{ env.NUGET_SOURCE }}
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            # 从 Release Tag 提取版本，自动去除可能存在的 'v' 前缀 (如 v1.2.0 -> 1.2.0)
            RAW_TAG="${{ github.event.release.tag_name }}"
            VERSION="${RAW_TAG#v}"
          else
            # 手动触发时使用输入的版本
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Resolved Version: $VERSION"

      - name: Pack NuGet
        run: |
          dotnet pack --configuration Release --no-build --output ./nupkgs \
            /p:PackageVersion=${{ env.VERSION }} \
            /p:ContinuousIntegrationBuild=true

      - name: Push to GitHub Packages
        shell: bash
        run: |
          # 推送主包
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source ${{ env.NUGET_SOURCE }} \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate
          
          # 如果生成了符号包 (.snupkg)，则一并推送以支持源码调试
          if ls ./nupkgs/*.snupkg 1> /dev/null 2>&1; then
            dotnet nuget push "./nupkgs/*.snupkg" \
              --source ${{ env.NUGET_SOURCE }} \
              --api-key ${{ secrets.GITHUB_TOKEN }} \
              --skip-duplicate
          fi
